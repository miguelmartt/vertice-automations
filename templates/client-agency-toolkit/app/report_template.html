<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<title>$title</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; color: #1a1a2e; }
  h2 { margin: 0 0 2px; }
  .muted { color: #6b7280; }
  table { width: 100%; border-collapse: collapse; margin: 6px 0 18px; }
  th, td { padding: 7px 9px; border-bottom: 1px solid #e5e7eb; text-align: left; font-size: 13px; }
  th { background: #1a1a2e; color: #fff; font-size: 11px; text-transform: uppercase; }
  td.r, th.r { text-align: right; }
  table.cards { border-collapse: separate; border-spacing: 12px 0; margin: 18px -12px; }
  td.card { width: 25%; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px 16px; }
  .card .n { font-size: 22px; font-weight: 700; }
</style>
</head>
<body>
  <h2>$title</h2>
  <div class="muted">$period</div>
  <table class="cards"><tr>
    <td class="card"><div class="muted">$visitors_label</div><div class="n">$visitors</div></td>
    <td class="card"><div class="muted">$pageviews_label</div><div class="n">$pageviews</div></td>
    <td class="card"><div class="muted">$bounce_label</div><div class="n">$bounce_rate</div></td>
    <td class="card"><div class="muted">$duration_label</div><div class="n">$visit_duration</div></td>
  </tr></table>
  <h3>$top_pages</h3>
  <table><thead><tr><th>$page_label</th><th class="r">$visitors_label</th></tr></thead><tbody>$pages</tbody></table>
  <h3>$top_sources</h3>
  <table><thead><tr><th>$source_label</th><th class="r">$visitors_label</th></tr></thead><tbody>$sources</tbody></table>
  <div class="muted" style="font-size:11px">$footer</div>
</body>
</html>
